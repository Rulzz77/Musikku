name: Build and publish MusikKu APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/auto-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musikku-auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version and check release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SPEC="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d "\r'\"")"
          if [[ -z "$VERSION_SPEC" || "$VERSION_SPEC" != *+* ]]; then
            echo "ERROR: pubspec.yaml version harus berformat contoh 2.5.12+72" >&2
            exit 1
          fi
          VERSION_NAME="${VERSION_SPEC%%+*}"
          BUILD_NUMBER="${VERSION_SPEC##*+}"
          APP_VERSION="$(sed -n "s/^[[:space:]]*const String appVersion = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"
          if [[ "$APP_VERSION" != "$VERSION_NAME" ]]; then
            echo "ERROR: version pubspec.yaml ($VERSION_NAME) tidak cocok dengan lib/app_info.dart ($APP_VERSION). Samakan keduanya." >&2
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          SKIP="false"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "$ASSETS" | grep -Fxq 'app-release.apk'; then
              SKIP="true"
              echo "Release $TAG sudah memiliki app-release.apk; tidak menerbitkan ulang." 
              echo "Naikkan versi di pubspec.yaml dan lib/app_info.dart untuk membuat rilis baru."
            else
              echo "Release $TAG sudah ada tetapi belum memiliki app-release.apk; APK akan dilampirkan." 
            fi
          else
            echo "Release $TAG belum ada; workflow akan membuatnya setelah build berhasil."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.release_state.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.release_state.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore stable Android signing key
        if: steps.release_state.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKKU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIKKU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIKKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIKKU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing GitHub Actions secrets for Android signing." >&2
            echo "Set MUSIKKU_KEYSTORE_BASE64, MUSIKKU_STORE_PASSWORD, MUSIKKU_KEY_ALIAS, and MUSIKKU_KEY_PASSWORD." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/musikku-upload-key.jks
          cat > android/key.properties <<EOF
          storeFile=app/musikku-upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install Flutter dependencies
        if: steps.release_state.outputs.skip != 'true'
        run: flutter pub get

      - name: Build signed release APK
        if: steps.release_state.outputs.skip != 'true'
        run: flutter build apk --release

      - name: Verify APK output
        if: steps.release_state.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "APK generated: $APK ($(stat -c%s "$APK") bytes)"

      - name: Publish APK to GitHub Release
        if: steps.release_state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
          VERSION_NAME: ${{ steps.release_state.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.release_state.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NOTES="$(printf 'Automated MusikKu release %s+%s.\n\nAPK dibangun oleh GitHub Actions dari branch main. Instalasi update tetap memerlukan persetujuan Android.' "$VERSION_NAME" "$BUILD_NUMBER")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "MusikKu $VERSION_NAME" \
              --notes "$NOTES"
          fi
