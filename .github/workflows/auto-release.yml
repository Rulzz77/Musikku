name: MusikKu Secure Release

# Publishing is intentionally manual so routine pushes cannot overwrite a public release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musikku-secure-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout full history and tags (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate app version and require a new release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SPEC="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d "\r'\"")"
          if [[ -z "$VERSION_SPEC" || "$VERSION_SPEC" != *+* ]]; then
            echo "::error::pubspec.yaml version must use NAME+BUILD format, for example 5.0.9+93."
            exit 1
          fi
          VERSION_NAME="${VERSION_SPEC%%+*}"
          BUILD_NUMBER="${VERSION_SPEC##*+}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ || ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pubspec version: $VERSION_SPEC"
            exit 1
          fi
          APP_VERSION="$(sed -n "s/^[[:space:]]*const String appVersion = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"
          APP_BUILD_NUMBER="$(sed -n "s/^[[:space:]]*const String appBuildNumber = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"
          if [[ "$APP_VERSION" != "$VERSION_NAME" || "$APP_BUILD_NUMBER" != "$BUILD_NUMBER" ]]; then
            echo "::error::pubspec.yaml ($VERSION_SPEC) and lib/app_info.dart ($APP_VERSION+$APP_BUILD_NUMBER) do not match."
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          if git tag --list "$TAG" | grep -Fxq "$TAG"; then
            echo "::error::Tag $TAG already exists. Bump VERSION_NAME (not only build number) before releasing; this workflow never overwrites an existing version."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists. This workflow never overwrites an existing release."
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify universal APK
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17 (pinned)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Scan tracked files before secrets are materialized
        shell: bash
        run: bash tool/security_preflight.sh

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKKU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIKKU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIKKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIKKU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are incomplete."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/musikku-upload-key.jks
          test -s android/app/musikku-upload-key.jks
          {
            printf 'storeFile=app/musikku-upload-key.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$YOUTUBE_API_KEY" ]]; then
            echo "::error::GitHub Secret YOUTUBE_API_KEY is not configured."
            exit 1
          fi
          flutter build apk --release --dart-define="YOUTUBE_API_KEY=${YOUTUBE_API_KEY}"
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/app/musikku-upload-key.jks android/key.properties

      - name: Upload APK for the publish job (short retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musikku-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable-version release
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built APK (pinned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: musikku-release-apk
          path: release-assets

      - name: Publish new release only; never clobber existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          TARGET_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release-assets/app-release.apk"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Existing public releases are never overwritten."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $TAG already exists. Create a new app version before publishing."
            exit 1
          fi
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          NOTES="$(printf 'MusikKu %s (build %s).\n\nAPK universal: app-release.apk\nSHA-256: %s\n\nKeamanan: release dibuat oleh workflow manual dan tidak menimpa tag/aset yang sudah ada.' "$VERSION_NAME" "$BUILD_NUMBER" "$SHA256")"
          gh release create "$TAG" "$APK" --repo "$GH_REPO" --title "MusikKu $VERSION_NAME" --notes "$NOTES" --target "$TARGET_SHA"
