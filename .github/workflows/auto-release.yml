name: Build and publish MusikKu APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/auto-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musikku-auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish GitHub Release
    # Build/release only from main, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version metadata
        id: release_state
        shell: bash
        run: |
          set -euo pipefail

          VERSION_SPEC="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d "\r'\"")"

          if [[ -z "$VERSION_SPEC" || "$VERSION_SPEC" != *+* ]]; then
            echo "::error::Version pubspec.yaml harus berformat contoh 4.6.2+36"
            exit 1
          fi

          VERSION_NAME="${VERSION_SPEC%%+*}"
          BUILD_NUMBER="${VERSION_SPEC##*+}"

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number harus berupa angka, ditemukan: $BUILD_NUMBER"
            exit 1
          fi

          APP_VERSION="$(sed -n "s/^[[:space:]]*const String appVersion = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"
          APP_BUILD_NUMBER="$(sed -n "s/^[[:space:]]*const String appBuildNumber = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"

          if [[ "$APP_VERSION" != "$VERSION_NAME" ]]; then
            echo "::error::Versi pubspec.yaml ($VERSION_NAME) tidak cocok dengan lib/app_info.dart ($APP_VERSION)"
            exit 1
          fi

          if [[ "$APP_BUILD_NUMBER" != "$BUILD_NUMBER" ]]; then
            echo "::error::Build number pubspec.yaml ($BUILD_NUMBER) tidak cocok dengan lib/app_info.dart ($APP_BUILD_NUMBER)"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Versi aplikasi: $VERSION_NAME"
          echo "Build number: $BUILD_NUMBER"
          echo "Release tag: $TAG"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKKU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIKKU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIKKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIKKU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Secret Android signing belum lengkap."
            echo "Periksa MUSIKKU_KEYSTORE_BASE64, MUSIKKU_STORE_PASSWORD, MUSIKKU_KEY_ALIAS, dan MUSIKKU_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/musikku-upload-key.jks
          test -s android/app/musikku-upload-key.jks || {
            echo "::error::Keystore hasil decode kosong. Periksa MUSIKKU_KEYSTORE_BASE64."
            exit 1
          }

          cat > android/key.properties <<EOF
          storeFile=app/musikku-upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build split APKs and compatibility universal APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Web OAuth Client ID bukan rahasia; Variables direkomendasikan.
          # Fallback ke Secrets jika sebelumnya sudah disimpan sebagai secret.
          YOUTUBE_WEB_CLIENT_ID: ${{ vars.YOUTUBE_WEB_CLIENT_ID || secrets.YOUTUBE_WEB_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${YOUTUBE_API_KEY:-}" ]]; then
            echo "::error::GitHub Secret YOUTUBE_API_KEY belum diatur."
            exit 1
          fi

          if [[ -z "${YOUTUBE_WEB_CLIENT_ID:-}" ]]; then
            echo "::error::YOUTUBE_WEB_CLIENT_ID belum diatur. Tambahkan sebagai Repository variable atau secret."
            exit 1
          fi

          if [[ "$YOUTUBE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::Format YOUTUBE_WEB_CLIENT_ID tidak benar. Gunakan Web OAuth Client ID."
            exit 1
          fi

          APK_DIR="build/app/outputs/flutter-apk"
          STASH="$RUNNER_TEMP/musikku-apk-assets"
          mkdir -p "$STASH"

          # Build per ABI first and stash the smaller downloads.
          flutter build apk --release --split-per-abi \
            --dart-define="YOUTUBE_API_KEY=${YOUTUBE_API_KEY}" \
            --dart-define="YOUTUBE_WEB_CLIENT_ID=${YOUTUBE_WEB_CLIENT_ID}"

          for NAME in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk; do
            if [[ ! -s "$APK_DIR/$NAME" ]]; then
              echo "::error::APK split tidak ditemukan: $APK_DIR/$NAME"
              exit 1
            fi
            cp "$APK_DIR/$NAME" "$STASH/$NAME"
          done

          # Build app-release.apk as a universal fallback so updater versions
          # installed before ABI-aware selection can still update safely.
          flutter build apk --release \
            --dart-define="YOUTUBE_API_KEY=${YOUTUBE_API_KEY}" \
            --dart-define="YOUTUBE_WEB_CLIENT_ID=${YOUTUBE_WEB_CLIENT_ID}"

          if [[ ! -s "$APK_DIR/app-release.apk" ]]; then
            echo "::error::APK universal app-release.apk tidak ditemukan."
            exit 1
          fi
          cp "$APK_DIR/app-release.apk" "$STASH/app-release.apk"

          # Restore all four distributables into the one release output folder.
          cp "$STASH"/*.apk "$APK_DIR/"

      - name: Verify APK outputs and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="build/app/outputs/flutter-apk"
          APK_NAMES=(
            "app-release.apk"
            "app-arm64-v8a-release.apk"
            "app-armeabi-v7a-release.apk"
            "app-x86_64-release.apk"
          )

          for NAME in "${APK_NAMES[@]}"; do
            APK="$APK_DIR/$NAME"
            if [[ ! -s "$APK" ]]; then
              echo "::error::APK tidak ditemukan atau kosong: $APK"
              exit 1
            fi
            SIZE="$(stat -c%s "$APK")"
            SHA256="$(sha256sum "$APK" | awk '{print $1}')"
            printf '%s  %s\n' "$SHA256" "$NAME" > "$APK_DIR/$NAME.sha256"
            echo "$NAME: $SIZE bytes (SHA-256: $SHA256)"
          done

          echo "Universal APK dipakai oleh updater versi lama; updater baru memilih APK split sesuai ABI perangkat."

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
          VERSION_NAME: ${{ steps.release_state.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.release_state.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="build/app/outputs/flutter-apk"
          ASSETS=(
            "$APK_DIR/app-release.apk"
            "$APK_DIR/app-release.apk.sha256"
            "$APK_DIR/app-arm64-v8a-release.apk"
            "$APK_DIR/app-arm64-v8a-release.apk.sha256"
            "$APK_DIR/app-armeabi-v7a-release.apk"
            "$APK_DIR/app-armeabi-v7a-release.apk.sha256"
            "$APK_DIR/app-x86_64-release.apk"
            "$APK_DIR/app-x86_64-release.apk.sha256"
          )
          NOTES="$(printf 'MusikKu %s+%s.\n\nAPK berarsitektur untuk unduhan lebih kecil:\n- app-arm64-v8a-release.apk: sebagian besar HP Android modern\n- app-armeabi-v7a-release.apk: perangkat Android 32-bit\n- app-x86_64-release.apk: emulator/perangkat x86_64\n\nKompatibilitas: app-release.apk universal tetap disertakan untuk updater di versi lama. MusikKu 4.5.1+ akan memilih APK split yang cocok dengan ABI perangkat secara otomatis.\n\nSetiap APK memiliki file checksum SHA-256.' "$VERSION_NAME" "$BUILD_NUMBER")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada; mengganti APK dan checksum yang dihasilkan workflow."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            echo "Membuat release baru: $TAG"
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "MusikKu $VERSION_NAME" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

          echo "Publikasi APK universal + split selesai."
