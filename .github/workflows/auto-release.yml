name: Build and publish MusikKu APK

on:
  # Publish a new release when the project version changes. Ordinary source
  # pushes no longer replace the same GitHub Release over and over.
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/auto-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musikku-auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version metadata
        id: release_state
        shell: bash
        run: |
          set -euo pipefail

          VERSION_SPEC="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d "\r'\"")"
          if [[ -z "$VERSION_SPEC" || "$VERSION_SPEC" != *+* ]]; then
            echo "::error::Version pubspec.yaml harus berformat contoh 5.0.7+91"
            exit 1
          fi

          VERSION_NAME="${VERSION_SPEC%%+*}"
          BUILD_NUMBER="${VERSION_SPEC##*+}"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number harus berupa angka, ditemukan: $BUILD_NUMBER"
            exit 1
          fi

          APP_VERSION="$(sed -n "s/^[[:space:]]*const String appVersion = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"
          APP_BUILD_NUMBER="$(sed -n "s/^[[:space:]]*const String appBuildNumber = '\([^']*\)';/\1/p" lib/app_info.dart | head -n 1)"
          if [[ "$APP_VERSION" != "$VERSION_NAME" ]]; then
            echo "::error::Versi pubspec.yaml ($VERSION_NAME) tidak cocok dengan lib/app_info.dart ($APP_VERSION)"
            exit 1
          fi
          if [[ "$APP_BUILD_NUMBER" != "$BUILD_NUMBER" ]]; then
            echo "::error::Build number pubspec.yaml ($BUILD_NUMBER) tidak cocok dengan lib/app_info.dart ($APP_BUILD_NUMBER)"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Versi aplikasi: $VERSION_NAME"
          echo "Build number: $BUILD_NUMBER"
          echo "Release tag: $TAG"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Restore stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKKU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSIKKU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIKKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIKKU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Secret Android signing belum lengkap."
            echo "Periksa MUSIKKU_KEYSTORE_BASE64, MUSIKKU_STORE_PASSWORD, MUSIKKU_KEY_ALIAS, dan MUSIKKU_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/musikku-upload-key.jks
          test -s android/app/musikku-upload-key.jks || {
            echo "::error::Keystore hasil decode kosong. Periksa MUSIKKU_KEYSTORE_BASE64."
            exit 1
          }
          cat > android/key.properties <<EOF
          storeFile=app/musikku-upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run regression tests
        run: flutter test --reporter expanded

      - name: Build one universal APK
        id: build_apk
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${YOUTUBE_API_KEY:-}" ]]; then
            echo "::error::GitHub Secret YOUTUBE_API_KEY belum diatur."
            exit 1
          fi
          flutter build apk --release --dart-define="YOUTUBE_API_KEY=${YOUTUBE_API_KEY}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK universal app-release.apk tidak ditemukan atau kosong."
            exit 1
          fi
          SIZE="$(stat -c%s "$APK")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "app-release.apk: $SIZE bytes (SHA-256: $SHA256)"

      - name: Publish one APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_state.outputs.tag }}
          VERSION_NAME: ${{ steps.release_state.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.release_state.outputs.build_number }}
          APK_SHA256: ${{ steps.build_apk.outputs.apk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NOTES="$(printf 'MusikKu %s+%s.\n\nUnduhan: app-release.apk (universal). Cukup unduh satu APK ini; tidak perlu memilih ABI/perangkat.\n\nSHA-256: %s\n\nRilis otomatis hanya berjalan saat pubspec.yaml berubah atau dijalankan manual dari GitHub Actions.' "$VERSION_NAME" "$BUILD_NUMBER" "$APK_SHA256")"

          LEGACY_ASSETS=(
            "app-release.apk.sha256"
            "app-arm64-v8a-release.apk"
            "app-arm64-v8a-release.apk.sha256"
            "app-armeabi-v7a-release.apk"
            "app-armeabi-v7a-release.apk.sha256"
            "app-x86_64-release.apk"
            "app-x86_64-release.apk.sha256"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada; membersihkan aset lama dan menyisakan satu APK universal."
            EXISTING_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for OLD_ASSET in "${LEGACY_ASSETS[@]}"; do
              if grep -Fqx "$OLD_ASSET" <<< "$EXISTING_ASSETS"; then
                gh release delete-asset "$TAG" "$OLD_ASSET" --yes
              fi
            done
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            echo "Membuat release baru: $TAG"
            gh release create "$TAG" "$APK" \
              --title "MusikKu $VERSION_NAME" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          echo "Publikasi selesai: satu file app-release.apk."
