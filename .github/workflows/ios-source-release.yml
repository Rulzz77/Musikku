name: MusikKu iPhone Source Release

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'fonts/**'
      - 'shaders/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/ios-source-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musikku-ios-source-release
  cancel-in-progress: false

jobs:
  publish-ios-source:
    name: Package and publish iOS source ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read iOS version from project file
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_FILE="ios/version.properties"
          if [[ ! -s "$VERSION_FILE" ]]; then
            echo "::error::Missing $VERSION_FILE. Add IOS_VERSION and IOS_BUILD_NUMBER in VS Code."
            exit 1
          fi

          # The file contains simple KEY=value entries and is maintained in the repository.
          source "$VERSION_FILE"

          if [[ ! "${IOS_VERSION:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::IOS_VERSION must look like 1.0.0."
            exit 1
          fi
          if [[ ! "${IOS_BUILD_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::IOS_BUILD_NUMBER must be a positive integer."
            exit 1
          fi

          TAG="ios-v${IOS_VERSION}"
          ZIP_NAME="MusikKu-iPhone-v${IOS_VERSION}-build${IOS_BUILD_NUMBER}-source.zip"
          echo "ios_version=$IOS_VERSION" >> "$GITHUB_OUTPUT"
          echo "ios_build_number=$IOS_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Check whether this iOS version was already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists. Update ios/version.properties before the next iOS release. Skipping."
          else
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists without a GitHub Release. Resolve that tag before publishing."
              exit 1
            fi
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package committed source
        if: steps.existing.outputs.published != 'true'
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix='MusikKu-iPhone/' HEAD > "$ZIP_NAME"
          test -s "$ZIP_NAME"
          unzip -t "$ZIP_NAME"

      - name: Publish iOS source release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IOS_VERSION: ${{ steps.version.outputs.ios_version }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.ios_build_number }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ZIP_NAME" \
            --repo "$GH_REPO" \
            --title "MusikKu iPhone v${IOS_VERSION}" \
            --notes "MusikKu iPhone source v${IOS_VERSION} (build ${IOS_BUILD_NUMBER}). This is a source ZIP, not a signed IPA installer. Build and sign the app with Xcode on macOS."
