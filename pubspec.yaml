name: flutter_application_5
description: "MusikKu - aplikasi streaming musik online dengan UI redesign tahap awal."
publish_to: 'none'
version: 2.5.10+70

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Tidak diimpor di Dart, tapi MainActivity memakai AudioServiceActivity
  # (menjaga Flutter engine tetap hidup saat background). Jangan dihapus
  # kecuali MainActivity diganti.
  audio_service: ^0.18.19
  flutter_local_notifications: ^22.3.1
  google_sign_in: ^7.2.0
  http: ^1.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
