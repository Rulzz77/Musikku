name: flutter_application_5
description: "MusikKu - pemutar musik Android."
publish_to: 'none'
version: 5.0.35+13

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  # Tidak diimpor di Dart, tapi MainActivity memakai AudioServiceActivity
  # (menjaga Flutter engine tetap hidup saat background). Jangan dihapus
  # kecuali MainActivity diganti.
  audio_service: ^0.18.19
  flutter_local_notifications: ^22.3.1
  # Retained while legacy account-service files remain in source.
  google_sign_in: ^6.3.0
  http: ^1.5.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
